name: iOS Build & Upload to TestFlight

# Build IPAs on GitHub's macOS runners.
# Required GitHub Secrets:
#   - ASC_API_KEY_ID
#   - ASC_API_ISSUER_ID
#   - ASC_API_KEY_P8 (contents of the .p8 file, base64-encoded)
#   - IOS_DISTRIBUTION_CERTIFICATE_BASE64 (exported Apple Distribution .p12, base64-encoded)
#   - IOS_DISTRIBUTION_CERTIFICATE_PASSWORD
#   - IOS_PROVISIONING_PROFILE_BASE64
#   - APP_STORE_APPLE_ID (numeric App Store Connect app record ID)
#   - REACT_APP_REVENUECAT_IOS_KEY (public iOS SDK key, never a server key)
# Trigger manually from Actions; repository pushes and tags never start signing.

on:
  workflow_dispatch:
    inputs:
      confirm_testflight:
        description: Confirm a signed build and upload to TestFlight
        required: true
        type: boolean
        default: false

permissions:
  contents: read

# Never allow two signed builds to race the same App Store Connect record.
concurrency:
  group: rmc-classics-testflight-upload
  cancel-in-progress: false

jobs:
  build-ios:
    name: Build iOS IPA
    if: ${{ inputs.confirm_testflight }}
    runs-on: macos-14
    timeout-minutes: 45
    environment: app-store-production

    steps:
      - uses: actions/checkout@v4

      - name: Verify release source is current main
        run: |
          set -eu
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          current_commit="$(git rev-parse --verify 'HEAD^{commit}')"
          main_commit="$(git rev-parse --verify 'refs/remotes/origin/main^{commit}')"
          if [ "$current_commit" != "$main_commit" ]; then
            echo "Refusing stale TestFlight source: $current_commit"
            echo "Current main is: $main_commit"
            echo "Run the workflow manually from current main."
            exit 1
          fi
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "commit=$current_commit"
            echo "verified_against=origin/main"
          } > "$GITHUB_WORKSPACE/release-source.txt"

      - name: Validate release configuration
        env:
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APP_STORE_APPLE_ID: ${{ secrets.APP_STORE_APPLE_ID }}
          REACT_APP_REVENUECAT_IOS_KEY: ${{ secrets.REACT_APP_REVENUECAT_IOS_KEY }}
        run: |
          set -eu
          invalid=0
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 IOS_DISTRIBUTION_CERTIFICATE_BASE64 IOS_DISTRIBUTION_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64; do
            value="$(printenv "$name" || true)"
            if [ -z "${value//[[:space:]]/}" ]; then
              echo "Missing required release secret: $name"
              invalid=1
            fi
          done
          if ! [[ "${APP_STORE_APPLE_ID:-}" =~ ^[1-9][0-9]+$ ]]; then
            echo "APP_STORE_APPLE_ID must be the real numeric App Store Connect Apple ID"
            invalid=1
          fi
          sdk_key="${REACT_APP_REVENUECAT_IOS_KEY:-}"
          if [[ ! "$sdk_key" =~ ^appl_[^[:space:]]+$ ]]; then
            echo "REACT_APP_REVENUECAT_IOS_KEY must be the public iOS SDK key beginning with appl_"
            invalid=1
          fi
          if [ "$invalid" -ne 0 ]; then
            echo "Configure every named GitHub Actions secret before starting another signed build."
            exit 1
          fi

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build web bundle
        working-directory: frontend
        env:
          CI: 'false'
          REACT_APP_REVENUECAT_IOS_KEY: ${{ secrets.REACT_APP_REVENUECAT_IOS_KEY }}
        run: npm run build

      - name: Sync Capacitor iOS
        working-directory: frontend
        run: npx cap sync ios

      - name: Install CocoaPods
        working-directory: frontend/ios/App
        run: pod install --repo-update

      - name: Install fastlane
        run: gem install fastlane -N -v 2.222

      - name: Install Apple Distribution certificate
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/rmc-build.keychain-db"
          KEYCHAIN_PASSWORD="rmc-ci-keychain"

          echo "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/RMC_Classics_App_Store_2026.mobileprovision"

      - name: Build & upload via fastlane
        working-directory: frontend/ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: fastlane testflight

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RMC-Classics-IPA
          path: frontend/ios/App/build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload release-source receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: RMC-Classics-release-source
          path: release-source.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Remove temporary signing material
        if: ${{ always() }}
        run: |
          set -eu
          CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/rmc-build.keychain-db"
          PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles/RMC_Classics_App_Store_2026.mobileprovision"

          security default-keychain -s login.keychain-db || true
          security list-keychain -d user -s login.keychain-db || true
          security delete-keychain "$KEYCHAIN_PATH" || true
          rm -f "$CERTIFICATE_PATH" "$PROFILE_PATH"
