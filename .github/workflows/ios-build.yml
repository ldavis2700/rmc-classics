name: iOS Build & Upload to TestFlight

# Build IPAs on GitHub's macOS runners.
# Required GitHub Secrets:
#   - ASC_API_KEY_ID
#   - ASC_API_ISSUER_ID
#   - ASC_API_KEY_P8 (contents of the .p8 file, base64-encoded)
#   - IOS_PROVISIONING_PROFILE_BASE64
# Trigger manually from Actions or with an intentional vX.Y.Z release tag.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend deps
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build web bundle
        working-directory: frontend
        env:
          CI: 'false'
        run: yarn build

      - name: Sync Capacitor iOS
        working-directory: frontend
        run: npx cap sync ios

      - name: Install CocoaPods
        working-directory: frontend/ios/App
        run: pod install --repo-update

      - name: Install fastlane
        run: gem install fastlane -N -v 2.222

      - name: Validate signing secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          test -n "$ASC_KEY_ID" || (echo "Missing ASC_API_KEY_ID" && exit 1)
          test -n "$ASC_ISSUER_ID" || (echo "Missing ASC_API_ISSUER_ID" && exit 1)
          test -n "$ASC_KEY_P8" || (echo "Missing ASC_API_KEY_P8" && exit 1)
          test -n "$IOS_PROVISIONING_PROFILE_BASE64" || (echo "Missing IOS_PROVISIONING_PROFILE_BASE64" && exit 1)

      - name: Install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/RMC_Classics_App_Store_2026.mobileprovision"

      - name: Build & upload via fastlane
        working-directory: frontend/ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: fastlane testflight

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RMC-Classics-IPA
          path: frontend/ios/App/build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30
