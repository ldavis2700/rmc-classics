name: RMC Classics Android Build Readiness

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/android-build.yml'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/capacitor.config.ts'
      - 'frontend/src/**'
      - 'tests/test_android_build_guard.py'

permissions:
  contents: read

concurrency:
  group: rmc-classics-android-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_COMMIT }}

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build production web bundle
        working-directory: frontend
        run: npm run build

      - name: Generate and sync isolated Capacitor Android shell
        working-directory: frontend
        run: |
          set -euo pipefail
          if [ -d android ]; then
            npx cap sync android
          else
            npx cap add android
            npx cap sync android
          fi
          grep -q 'applicationId "com.rmcclassics.app"' android/app/build.gradle

      - name: Compile non-publishing Android App Bundle
        working-directory: frontend/android
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify 'HEAD^{commit}')" = "$SOURCE_COMMIT" || {
            echo "Checkout does not match the exact requested source commit."
            exit 1
          }
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease
          AAB='app/build/outputs/bundle/release/app-release.aab'
          test -s "$AAB"
          unzip -t "$AAB"
          unzip -Z1 "$AAB" | grep -qx 'base/manifest/AndroidManifest.xml'
          SIGNATURES="$(unzip -Z1 "$AAB" | grep -E '^META-INF/[^/]+\.(RSA|DSA|EC)$' || true)"
          test -z "$SIGNATURES" || {
            echo "Refusing signed artifact in non-publishing readiness workflow."
            exit 1
          }
          BUNDLE_SHA256="$(shasum -a 256 "$AAB" | awk '{print $1}')"
          test -n "$BUNDLE_SHA256"
          printf '%s  %s\n' "$BUNDLE_SHA256" "$AAB" > app-release.aab.sha256
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "commit=$(git rev-parse --verify 'HEAD^{commit}')"
            echo "bundle_id=com.rmcclassics.app"
            echo "artifact=$AAB"
            echo "sha256=$BUNDLE_SHA256"
            echo "signing_state=unsigned-readiness-only"
          } > android-readiness-metadata.txt

      - name: Retain Android readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: rmc-classics-android-readiness-${{ env.SOURCE_COMMIT }}
          path: |
            frontend/android/app/build/outputs/bundle/release/app-release.aab
            frontend/android/app-release.aab.sha256
            frontend/android/android-readiness-metadata.txt
          if-no-files-found: error
          retention-days: 7
