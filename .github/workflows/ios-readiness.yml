name: RMC Classics iOS Build Readiness

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/ios-readiness.yml'

permissions:
  contents: read

concurrency:
  group: rmc-ios-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-readiness:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
      COCOAPODS_VERSION: 1.16.2
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify source and native tools
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          xcodebuild -version
          test "$(xcodebuild -version | head -1)" = "Xcode 26.5"
          gem install cocoapods --no-document --version "$COCOAPODS_VERSION"
          test "$(pod --version)" = "$COCOAPODS_VERSION"
          npm install --global npm@10.9.4
          test "$(npm --version)" = "10.9.4"
      - name: Build and sync locked frontend
        working-directory: frontend
        env:
          CI: 'false'
          REACT_APP_BACKEND_URL: https://rmcclassics.com
        run: |
          npm ci
          npm run build
          ./node_modules/.bin/cap sync ios
      - name: Compile unsigned native archive
        working-directory: frontend/ios/App
        run: |
          set -euo pipefail
          pod install --repo-update
          ruby -c fastlane/Fastfile
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/RMC-readiness.xcarchive" \
            CODE_SIGNING_ALLOWED=NO archive
          APP="$RUNNER_TEMP/RMC-readiness.xcarchive/Products/Applications/App.app"
          test -d "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = 'com.rmcclassics.app'
          if codesign --verify "$APP" 2>/dev/null; then
            echo 'Refusing signed output in unsigned readiness workflow'
            exit 1
          fi
          {
            echo "commit=$SOURCE_COMMIT"
            echo 'bundle_id=com.rmcclassics.app'
            echo 'signing_state=unsigned-readiness-only'
            xcodebuild -version
            shasum -a 256 "$APP/App"
          } > "$RUNNER_TEMP/ios-readiness.txt"
      - name: Retain readiness receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-readiness-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/ios-readiness.txt
          if-no-files-found: error
          retention-days: 14
