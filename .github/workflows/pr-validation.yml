name: RMC Classics PR Validation

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'codemagic.yaml'
  push:
    branches:
      - 'agent/**'
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'codemagic.yaml'

permissions:
  contents: read

concurrency:
  group: rmc-pr-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Pin npm toolchain
        run: |
          npm install --global npm@10.9.4
          test "$(npm --version)" = "10.9.4"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          CI: 'false'
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Validate backend syntax and focused release regressions
        run: |
          python -m py_compile backend/server.py
          python -m pip install --disable-pip-version-check pytest==8.3.5
          python -m pytest -q tests backend/tests/test_iap_idempotency_unit.py backend/tests/test_username_safety_unit.py backend/tests/test_block_visibility_unit.py backend/tests/test_safety_moderation_unit.py backend/tests/test_account_deletion_unit.py backend/tests/test_terms_consent_unit.py backend/tests/test_battle_invite_unit.py backend/tests/test_battle_join_unit.py backend/tests/test_battle_rematch_unit.py

      - name: Test battle WebSocket input recovery
        # WebSocket protocol tests use only the standard library and fake I/O.
        # They exercise the real handler without live accounts or sockets.
        run: python -m unittest discover -s backend/tests -p 'test_battle_websocket_unit.py' -v

      - name: Verify Dominoes and Spades rules, privacy, concurrency, and persistence
        env:
          RMC_TEST_MONGO_URL: mongodb://127.0.0.1:27017/?serverSelectionTimeoutMS=5000
        run: |
          python -m pip install fastapi==0.110.1 motor==3.3.1 pymongo==4.6.3 httpx==0.27.2 mongomock-motor==0.0.36 uvicorn==0.25.0 bcrypt==4.1.3 PyJWT==2.15.1 python-dotenv==1.2.4 email-validator==2.3.0
          python -m pytest -q backend/tests/test_table_rules.py backend/tests/test_game_tables.py

      - name: Verify production bundle through real API and disposable MongoDB
        env:
          RMC_TEST_MONGO_URL: mongodb://127.0.0.1:27017/?serverSelectionTimeoutMS=5000
          RMC_PLAYWRIGHT_MODULE: ${{ runner.temp }}/rmc-browser/node_modules/playwright
        run: |
          npm install --prefix "$RUNNER_TEMP/rmc-browser" --no-save --no-audit --no-fund playwright@1.58.2
          node "$RMC_PLAYWRIGHT_MODULE/cli.js" install --with-deps chromium
          python scripts/run_table_browser_test.py

      - name: Protect Apple Review remediation
        run: |
          # Guideline 1.2: consent plus developer-visible Report and Block controls.
          grep -q 'accepted_terms: bool = False' backend/server.py
          grep -q 'TERMS_VERSION = "2026-08-20"' backend/server.py
          grep -q 'Terms acceptance required' backend/server.py
          grep -q 'login(email, password, acceptedTerms)' frontend/src/pages/Login.jsx
          grep -q '@api.post("/safety/report")' backend/server.py
          grep -q '@api.post("/safety/block/{target_user_id}")' backend/server.py
          grep -q '@api.get("/safety/moderation/reports")' backend/server.py
          grep -q '@api.patch("/safety/moderation/reports/{report_id}")' backend/server.py
          grep -q 'Depends(get_moderation_operator)' backend/server.py
          ! grep -q 'admin123' backend/server.py
          grep -q 'accepted_terms: acceptedTerms' frontend/src/context/AuthContext.jsx
          grep -q 'aria-label="Report user"' frontend/src/pages/Friends.jsx
          grep -q 'aria-label="Block user"' frontend/src/pages/Friends.jsx
          grep -q '_validated_player_name(body.name)' backend/server.py
          grep -q '_public_player_name' backend/server.py
          grep -q 'get_optional_current_user' backend/server.py

          # Guideline 5.1.1(v): authenticated, in-app permanent account deletion.
          grep -q '@api.delete("/auth/account")' backend/server.py
          grep -q 'Permanently delete account' frontend/src/pages/AccountSettings.jsx
          grep -q 'verify_password(body.password' backend/server.py
          grep -q '_deleted_account_ref' backend/server.py
          grep -q 'db.iap_events.update_many' backend/server.py
          grep -q 'delete-account-password-input' frontend/src/pages/AccountSettings.jsx
          grep -q 'data: { password }' frontend/src/context/AuthContext.jsx

          # Public disclosures must match the actual in-app safety and deletion paths.
          grep -q 'Profile → Account Settings → Delete Account' frontend/src/pages/Legal.jsx
          grep -q 'Open Friends, select the player, then use Report or Block' frontend/src/pages/Legal.jsx

          # Guideline 2.1(b): the submitted consumable remains consistent end-to-end.
          grep -q 'FREEZE_PACK_5_ID = "rmc.freeze.pack5"' backend/server.py
          grep -q 'id: "rmc.freeze.pack5"' frontend/src/lib/iap.js

          # Acquisition loop: native invites must be public and survive authentication.
          grep -q 'https://rmcclassics.com' frontend/src/lib/routes.js
          grep -q 'publicBattleInviteUrl(roomId)' frontend/src/pages/BattlePlay.jsx
          grep -q 'await share({' frontend/src/pages/BattlePlay.jsx
          grep -q 'state={{ from }}' frontend/src/App.js
          grep -q 'navigate(returnTo, { replace: true })' frontend/src/pages/Login.jsx
          grep -q 'navigate(returnTo, { replace: true })' frontend/src/pages/Register.jsx

      - name: Confirm iOS project and Capacitor config exist
        run: |
          test -f frontend/capacitor.config.ts
          test -d frontend/ios/App

      - name: Validate Fastlane lane syntax
        run: ruby -c frontend/ios/App/fastlane/Fastfile

      - name: Validate Codemagic monetization release gate
        run: |
          set -eu
          ruby -e "require 'yaml'; YAML.safe_load_file('codemagic.yaml', aliases: true)"
          ! grep -Eq 'APP_STORE_APPLE_ID:[[:space:]]*0+' codemagic.yaml
          grep -q 'APP_STORE_APPLE_ID must be the real numeric App Store Connect Apple ID' codemagic.yaml
          grep -q 'REACT_APP_REVENUECAT_IOS_KEY must be configured as a protected Codemagic variable' codemagic.yaml
          grep -q 'Verify release source is current main' codemagic.yaml
          python tests/test_release_source_guard.py
          python tests/test_release_configuration_guard.py
          python tests/test_github_release_guard.py
          python tests/test_ios_build_number_guard.py
          grep -q 'release-source.txt' codemagic.yaml
