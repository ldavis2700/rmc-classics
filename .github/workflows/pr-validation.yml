name: RMC Classics PR Validation

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/**'
  push:
    branches:
      - 'agent/**'
    paths:
      - 'frontend/**'
      - '.github/workflows/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        env:
          CI: 'false'
        run: yarn build

      - name: Confirm iOS project and Capacitor config exist
        run: |
          test -f frontend/capacitor.config.ts
          test -d frontend/ios/App

      - name: Validate Fastlane lane syntax
        run: ruby -c frontend/ios/App/fastlane/Fastfile
