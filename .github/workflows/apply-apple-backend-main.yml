name: Apply Apple Review Backend Compliance To Main

on:
  push:
    branches:
      - main
    paths:
      - docs/.apple-backend-main-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate patch script
        run: python -m py_compile scripts/apply_apple_backend_patch.py
      - name: Apply backend compliance patch
        run: python scripts/apply_apple_backend_patch.py
      - name: Validate patched backend
        run: |
          python -m py_compile backend/server.py
          grep -q 'accepted_terms: bool = False' backend/server.py
          grep -q '@api.delete("/auth/account")' backend/server.py
          grep -q '@api.post("/safety/report")' backend/server.py
          grep -q '@api.post("/safety/block/{target_user_id}")' backend/server.py
          grep -q 'safety_reports.create_index' backend/server.py
      - name: Commit backend compliance
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/server.py
          git commit -m "Add backend Apple review compliance endpoints"
          git push origin HEAD:main
