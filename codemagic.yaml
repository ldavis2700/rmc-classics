# Codemagic CI/CD — Cloud IPA builds for RMC Classics
# --------------------------------------------------
# HOW THIS WORKS (no Mac needed on your side):
#   1. Push this repo to GitHub / GitLab / Bitbucket
#   2. Sign up at https://codemagic.io (free tier: 500 build-minutes / month)
#   3. Connect your repo -> Codemagic detects this file automatically
#   4. In Codemagic dashboard: Team settings -> Integrations -> App Store Connect
#      Upload the .p8 API key (Users and Access -> Integrations -> App Store Connect API)
#   5. Start the ios-testflight workflow manually only when a release candidate is ready.
#
# Two workflows below:
#   * ios-testflight  -> signed IPA uploaded to TestFlight automatically (recommended)
#   * ios-unsigned    -> unsigned IPA for local inspection only
#
# Cost/release guardrail:
#   Signed iOS release builds are intentionally manual. Ordinary pushes to main must
#   not consume Codemagic macOS minutes or upload unintended TestFlight candidates.
#
# Docs: https://docs.codemagic.io/yaml-quick-start/building-a-capacitor-app/

workflows:
  ios-testflight:
    name: RMC Classics -> TestFlight
    max_build_duration: 60
    environment:
      groups:
        - rmc_release
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.rmcclassics.app
      vars:
        XCODE_WORKSPACE: "frontend/ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        # APP_STORE_APPLE_ID and REACT_APP_REVENUECAT_IOS_KEY are loaded from
        # the protected rmc_release Codemagic environment variable group.
        # Never commit store IDs as placeholders or any RevenueCat private/server key.
        REACT_APP_BACKEND_URL: "https://rmcclassics.com"
      node: 20
      xcode: latest
      cocoapods: default
    integrations:
      app_store_connect: RMC ASC Key

    scripts:
      - name: Install frontend deps
        script: |
          cd frontend
          yarn install --frozen-lockfile

      - name: Validate monetization release configuration
        script: |
          if ! echo "$APP_STORE_APPLE_ID" | grep -Eq '^[1-9][0-9]+$'; then
            echo "APP_STORE_APPLE_ID must be the real numeric App Store Connect Apple ID"
            exit 1
          fi
          if [ -z "$REACT_APP_REVENUECAT_IOS_KEY" ]; then
            echo "REACT_APP_REVENUECAT_IOS_KEY must be configured as a protected Codemagic variable"
            exit 1
          fi

      - name: Build the web bundle
        script: |
          cd frontend
          CI=false yarn build

      - name: Sync Capacitor iOS
        script: |
          cd frontend
          npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd frontend/ios/App
          pod install --repo-update

      - name: Set build number
        script: |
          cd frontend/ios/App
          agvtool new-version -all "$(($BUILD_NUMBER + 1))"

      - name: Fetch iOS signing files from App Store Connect
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.rmcclassics.app" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build .ipa
        script: |
          cd frontend/ios/App
          xcode-project build-ipa \
            --workspace App.xcworkspace \
            --scheme App

    artifacts:
      - frontend/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - frontend/ios/App/App.xcarchive

    publishing:
      email:
        recipients:
          - hello@rmcclassics.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups: []

  ios-unsigned:
    name: RMC Classics -> Unsigned IPA (inspection only)
    max_build_duration: 60
    environment:
      vars:
        XCODE_WORKSPACE: "frontend/ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 20
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install frontend deps
        script: |
          cd frontend
          yarn install --frozen-lockfile

      - name: Build web bundle
        script: |
          cd frontend
          CI=false yarn build

      - name: Sync Capacitor iOS
        script: |
          cd frontend
          npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd frontend/ios/App
          pod install --repo-update

      - name: Build unsigned archive
        script: |
          cd frontend/ios/App
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release \
            -archivePath $CM_BUILD_DIR/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            archive

    artifacts:
      - $CM_BUILD_DIR/App.xcarchive
