# Codemagic CI/CD — Cloud IPA builds for RMC Classics
# --------------------------------------------------
# HOW THIS WORKS (no Mac needed on your side):
#   1. Push this repo to GitHub / GitLab / Bitbucket
#   2. Sign up at https://codemagic.io (free tier: 500 build-minutes / month)
#   3. Connect your repo -> Codemagic detects this file automatically
#   4. In Codemagic dashboard: Team settings -> Integrations -> App Store Connect
#      Upload the .p8 API key (Users and Access -> Integrations -> App Store Connect API)
#   5. Start the signed ios-testflight workflow manually from current main.
#      Automatic branch/tag triggers are intentionally disabled so signing and
#      TestFlight upload always require an owner-controlled Codemagic action.
#
# Two workflows below:
#   * ios-testflight  -> manually started signed IPA upload to TestFlight
#   * ios-unsigned    -> unsigned IPA for local inspection only
#
# Cost/release guardrail:
#   Signed iOS release builds never start from repository pushes or tags.
#   They require a deliberate manual start in Codemagic from current main.
#
# Docs: https://docs.codemagic.io/yaml-running-builds/starting-builds-automatically/

workflows:
  ios-testflight:
    name: RMC Classics -> TestFlight
    max_build_duration: 60
    environment:
      groups:
        - rmc_release
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.rmcclassics.app
      vars:
        XCODE_WORKSPACE: "frontend/ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        # APP_STORE_APPLE_ID and REACT_APP_REVENUECAT_IOS_KEY are loaded from
        # the protected rmc_release Codemagic environment variable group.
        # Never commit store IDs as placeholders or any RevenueCat private/server key.
        REACT_APP_BACKEND_URL: "https://rmcclassics.com"
      node: 20
      xcode: latest
      cocoapods: default
    integrations:
      app_store_connect: RMC ASC Key

    scripts:
      - name: Verify release source is current main
        script: |
          set -eu
          # Refuse stale tags/branches before dependency installation, signing,
          # or other expensive release work.
          # Codemagic may fetch only a tag/SHA, with no remote-tracking main.
          # Refresh that ref explicitly and stop immediately if fetching fails.
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          CURRENT_COMMIT="$(git rev-parse --verify 'HEAD^{commit}')"
          MAIN_COMMIT="$(git rev-parse --verify 'refs/remotes/origin/main^{commit}')"
          if [ "$CURRENT_COMMIT" != "$MAIN_COMMIT" ]; then
            echo "Refusing stale TestFlight source: $CURRENT_COMMIT"
            echo "Current main is: $MAIN_COMMIT"
            echo "Manually select the current main revision before restarting this workflow."
            exit 1
          fi
          {
            echo "repository=ldavis2700/rmc-classics"
            echo "commit=$CURRENT_COMMIT"
            echo "verified_against=origin/main"
          } > "$CM_BUILD_DIR/release-source.txt"

      - name: Validate monetization release configuration
        script: |
          set -eu
          invalid=0
          if ! [[ "${APP_STORE_APPLE_ID:-}" =~ ^[1-9][0-9]+$ ]]; then
            echo "APP_STORE_APPLE_ID must be the real numeric App Store Connect Apple ID"
            invalid=1
          fi
          sdk_key="${REACT_APP_REVENUECAT_IOS_KEY:-}"
          if [[ ! "$sdk_key" =~ ^appl_[^[:space:]]+$ ]]; then
            echo "REACT_APP_REVENUECAT_IOS_KEY must be a protected public iOS SDK key beginning with appl_"
            invalid=1
          fi
          if [ "$invalid" -ne 0 ]; then
            echo "Configure both variables in the imported rmc_release group before starting another signed build."
            exit 1
          fi

      - name: Install frontend deps
        script: |
          cd frontend
          npm ci

      - name: Build the web bundle
        script: |
          cd frontend
          CI=false npm run build

      - name: Sync Capacitor iOS
        script: |
          cd frontend
          npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd frontend/ios/App
          pod install --repo-update

      - name: Set collision-safe App Store build number
        script: |
          set -eu
          LATEST_BUILD_NUMBER="$(
            app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID"
          )"
          case "$LATEST_BUILD_NUMBER" in
            ''|*[!0-9]*)
              echo "App Store Connect returned an invalid latest build number"
              exit 1
              ;;
          esac
          NEXT_BUILD_NUMBER="$((LATEST_BUILD_NUMBER + 1))"
          test "$NEXT_BUILD_NUMBER" -gt "$LATEST_BUILD_NUMBER"
          cd frontend/ios/App
          agvtool new-version -all "$NEXT_BUILD_NUMBER"

      - name: Fetch iOS signing files from App Store Connect
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.rmcclassics.app" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build .ipa
        script: |
          cd frontend/ios/App
          xcode-project build-ipa \
            --workspace App.xcworkspace \
            --scheme App

      - name: Verify signed IPA identity and record provenance
        script: |
          set -eu
          IPA_DIR="$CM_BUILD_DIR/frontend/ios/App/build/ios/ipa"
          IPA_COUNT="$(find "$IPA_DIR" -maxdepth 1 -type f -name '*.ipa' | wc -l | tr -d '[:space:]')"
          test "$IPA_COUNT" = "1" || {
            echo "Expected exactly one signed IPA, found $IPA_COUNT"
            exit 1
          }
          IPA_PATH="$(find "$IPA_DIR" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          VERIFY_DIR="$CM_BUILD_DIR/ipa-verify"
          mkdir -p "$VERIFY_DIR"
          unzip -q "$IPA_PATH" -d "$VERIFY_DIR"
          APP_PATH="$(find "$VERIFY_DIR/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH" || {
            echo 'Signed IPA does not contain one application bundle'
            exit 1
          }
          codesign --verify --deep --strict "$APP_PATH"
          PROFILE_PATH="$APP_PATH/embedded.mobileprovision"
          test -s "$PROFILE_PATH" || {
            echo 'Signed IPA is missing its embedded provisioning profile'
            exit 1
          }
          PROFILE_PLIST="$VERIFY_DIR/embedded-profile.plist"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_APPLICATION_IDENTIFIER="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")"
          PROFILE_TEAM_IDENTIFIER="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.team-identifier' "$PROFILE_PLIST")"
          SIGNED_ENTITLEMENTS="$VERIFY_DIR/signed-entitlements.plist"
          codesign -d --entitlements :- "$APP_PATH" > "$SIGNED_ENTITLEMENTS"
          SIGNED_APPLICATION_IDENTIFIER="$(/usr/libexec/PlistBuddy -c 'Print :application-identifier' "$SIGNED_ENTITLEMENTS")"
          SIGNED_TEAM_IDENTIFIER="$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.team-identifier' "$SIGNED_ENTITLEMENTS")"
          PROFILE_EXPIRATION="$(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$PROFILE_PLIST")"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")"
          BUILD_NUMBER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")"
          test "$BUNDLE_ID" = "com.rmcclassics.app"
          test "$PROFILE_APPLICATION_IDENTIFIER" = "$PROFILE_TEAM_IDENTIFIER.$BUNDLE_ID" || {
            echo 'Provisioning profile does not authorize the IPA bundle identifier'
            exit 1
          }
          test "$SIGNED_APPLICATION_IDENTIFIER" = "$PROFILE_APPLICATION_IDENTIFIER" || {
            echo 'Signed app identifier does not match its provisioning profile'
            exit 1
          }
          test "$SIGNED_TEAM_IDENTIFIER" = "$PROFILE_TEAM_IDENTIFIER" || {
            echo 'Signed team identifier does not match its provisioning profile'
            exit 1
          }
          ruby -rtime -e '
            expiration = Time.parse(ARGV.fetch(0))
            abort("Provisioning profile is expired") unless expiration > Time.now
          ' "$PROFILE_EXPIRATION"
          test -n "$VERSION"
          case "$BUILD_NUMBER" in ''|*[!0-9]*) echo 'IPA build number must be numeric'; exit 1;; esac
          {
            echo "repository=ldavis2700/rmc-classics"
            echo "commit=$(git rev-parse --verify 'HEAD^{commit}')"
            echo "bundle_id=$BUNDLE_ID"
            echo "version=$VERSION"
            echo "build_number=$BUILD_NUMBER"
            echo "profile_application_identifier=$PROFILE_APPLICATION_IDENTIFIER"
            echo "signed_application_identifier=$SIGNED_APPLICATION_IDENTIFIER"
            echo "signed_team_identifier=$SIGNED_TEAM_IDENTIFIER"
            echo "profile_expiration=$PROFILE_EXPIRATION"
            shasum -a 256 "$IPA_PATH"
          } > "$CM_BUILD_DIR/release-ipa-metadata.txt"

    artifacts:
      - $CM_BUILD_DIR/release-source.txt
      - $CM_BUILD_DIR/release-ipa-metadata.txt
      - frontend/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - frontend/ios/App/App.xcarchive

    publishing:
      email:
        recipients:
          - hello@rmcclassics.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups: []

  ios-unsigned:
    name: RMC Classics -> Unsigned IPA (inspection only)
    max_build_duration: 60
    environment:
      vars:
        XCODE_WORKSPACE: "frontend/ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 20
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install frontend deps
        script: |
          cd frontend
          npm ci

      - name: Build web bundle
        script: |
          cd frontend
          CI=false npm run build

      - name: Sync Capacitor iOS
        script: |
          cd frontend
          npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd frontend/ios/App
          pod install --repo-update

      - name: Build unsigned archive
        script: |
          cd frontend/ios/App
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release \
            -archivePath $CM_BUILD_DIR/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            archive

    artifacts:
      - $CM_BUILD_DIR/App.xcarchive
